services:
  # ResumeIQ Full-Stack Web Service (FastAPI API + Vanilla JS/HTML/CSS Frontend)
  - type: web
    name: resumeiq
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SESSION_SECRET
        generateValue: true
